    <!-- Google AdSense Account Verification & Smart Deferred Script Loader (Protects Mobile LCP & TBT) -->
    <meta name="google-adsense-account" content="ca-pub-8769496591745522" />
    <script>
      (function () {
        var adsLoaded = false;
        function loadAdSense() {
          if (adsLoaded) return;
          var p = window.location.pathname || '';
          if (p === '/sabbir' || p === '/sabbir.html' || p.indexOf('/sabbir') === 0) return;
          adsLoaded = true;
          var s = document.createElement('script');
          s.async = true;
          s.crossOrigin = 'anonymous';
          s.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8769496591745522';
          document.head.appendChild(s);
        }
        ['scroll', 'mousemove', 'touchstart', 'pointerdown', 'keydown', 'click'].forEach(function (evt) {
          window.addEventListener(evt, loadAdSense, { once: true, passive: true });
        });
      })();
    </script>

    <!-- Instant Theme Bootstrap (Zero Flash) -->
    <script>
      (function() {
        try {
          var path = window.location.pathname || '';
          if (path === '/sabbir' || path === '/sabbir.html' || path.indexOf('/sabbir') === 0) {
            document.documentElement.classList.add('dark');
            return;
          }
          var saved = localStorage.getItem('toolnest-theme');
          var isLight = saved === '"light"' || saved === 'light' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
          if (isLight) {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
