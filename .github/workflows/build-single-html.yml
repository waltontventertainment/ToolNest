name: "Cloudflare Pages & Production Web CI/CD"

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  deployments: write

jobs:
  build-and-verify:
    name: "Build, Verify & Deploy Production Distribution"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "Setup Node.js (Active LTS 22)"
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: "Install Project Dependencies"
        run: |
          echo "📦 Installing npm dependencies with clean state..."
          if [ -f "package-lock.json" ]; then
            npm ci || npm install --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: "Generate Dynamic SEO Sitemaps, RSS & Robots"
        run: |
          echo "🌐 Generating dynamic XML sitemaps, RSS feed and robots.txt..."
          npm run generate:seo

      - name: "Static Typecheck & Linting"
        run: |
          echo "🔍 Validating TypeScript types and syntax..."
          npm run lint

      - name: "Build Production Bundle (Vite)"
        run: |
          echo "⚡ Building production bundle for Cloudflare Pages..."
          npm run build
        env:
          NODE_ENV: production
          BUILD_SINGLEFILE: 'false'

      - name: "Ultra-High Performance Pre-Compression (Brotli & Gzip)"
        run: |
          echo "🗜️ Pre-compressing production assets with maximum Brotli (-q 11) & Gzip (-9)..."
          sudo apt-get update -qq && sudo apt-get install -y -qq brotli
          find dist/ -type f \( -name "*.js" -o -name "*.css" -o -name "*.html" -o -name "*.svg" -o -name "*.json" -o -name "*.xml" -o -name "*.txt" \) -exec gzip -k -9 -f {} +
          find dist/ -type f \( -name "*.js" -o -name "*.css" -o -name "*.html" -o -name "*.svg" -o -name "*.json" -o -name "*.xml" -o -name "*.txt" \) -exec brotli -k -q 11 -f {} +
          echo "✅ All static assets pre-compressed for instant Cloudflare Pages delivery!"

      - name: "Verify Cloudflare Deployment Files, Favicons, Sitemaps & Asset Paths in dist/"
        run: |
          echo "🔍 Verifying presence of Cloudflare routing, favicons, sitemaps, static assets, and SEO files in dist/..."
          ls -la dist/

          # 1. Ensure Cloudflare Pages _redirects file exists for SPA routing
          if [ ! -f "dist/_redirects" ]; then
            echo "Creating dist/_redirects for Cloudflare Pages SPA routing..."
            printf "/sabbirhasan23m.html /sabbirhasan23m.html 200\n/sabbirhasan23m /sabbirhasan23m.html 200\n/* /index.html 200\n" > dist/_redirects
          fi

          # 2. Verify Primary Entrypoints
          if [ ! -f "dist/index.html" ]; then
            echo "❌ [ERROR] dist/index.html is missing!"
            exit 1
          else
            echo "  ✅ [OK] dist/index.html exists."
          fi

          # Verify Admin Entrypoint (Supports sabbirhasan23m.html or fallback)
          if [ -f "dist/sabbirhasan23m.html" ]; then
            echo "  ✅ [OK] dist/sabbirhasan23m.html (Admin Portal) exists."
          elif [ -f "dist/sabbir.html" ]; then
            echo "  ✅ [OK] dist/sabbir.html exists."
          else
            echo "⚠️ [WARN] Custom admin HTML entrypoint not found, copying index.html as fallback..."
            cp dist/index.html dist/sabbirhasan23m.html
          fi

          # 3. Check essential root assets, manifests, favicons, and SEO files
          REQUIRED_FILES=(
            "pdf.worker.mjs"
            "_headers"
            "_redirects"
            "favicon.ico"
            "favicon.svg"
            "favicon.png"
            "favicon-16x16.png"
            "favicon-32x32.png"
            "favicon-48x48.png"
            "favicon-96x96.png"
            "apple-touch-icon.png"
            "android-chrome-192x192.png"
            "android-chrome-512x512.png"
            "logo.png"
            "og-banner.jpg"
            "site.webmanifest"
            "manifest.json"
            "browserconfig.xml"
            "robots.txt"
            "sitemap-index.xml"
            "sitemap.xml"
            "sitemap-tools.xml"
            "sitemap-categories.xml"
            "sitemap-pages.xml"
            "sitemap-blog.xml"
            "rss.xml"
            "feed.xml"
            "llms.txt"
            "humans.txt"
            "ads.txt"
            "app-ads.txt"
            "security.txt"
            "googlea0fb90138c92702a.html"
          )

          MISSING_FILES=0
          for file in "${REQUIRED_FILES[@]}"; do
            if [ -f "dist/$file" ]; then
              echo "  ✅ [OK] dist/$file exists."
            else
              echo "  ⚠️ [WARN] dist/$file is missing from build output."
              MISSING_FILES=$((MISSING_FILES+1))
            fi
          done

          # 4. Check essential static directories
          for dir in assets cmaps data; do
            if [ -d "dist/$dir" ]; then
              echo "  ✅ [OK] dist/$dir/ directory exists."
            else
              echo "  ❌ [ERROR] dist/$dir/ directory is missing!"
              exit 1
            fi
          done

          # 5. Check countries dataset
          if [ -f "dist/data/countries.json" ]; then
            echo "  ✅ [OK] dist/data/countries.json exists."
          else
            echo "  ⚠️ [WARN] dist/data/countries.json missing, ensuring public copy..."
            mkdir -p dist/data
            [ -f "public/data/countries.json" ] && cp public/data/countries.json dist/data/
          fi

          # 6. Verify that all XML sitemaps in dist/ are valid, non-empty XML documents
          if grep -q '<sitemapindex' dist/sitemap-index.xml && \
             grep -q '<urlset' dist/sitemap.xml && \
             grep -q '<urlset' dist/sitemap-tools.xml && \
             grep -q '<urlset' dist/sitemap-categories.xml && \
             grep -q '<urlset' dist/sitemap-pages.xml && \
             grep -q '<urlset' dist/sitemap-blog.xml && \
             grep -q '<rss' dist/rss.xml; then
            echo "  ✅ [OK] All XML sitemaps and RSS feed in dist/ are valid XML."
          else
            echo "  ❌ [ERROR] One or more XML sitemaps in dist/ are invalid or malformed!"
            exit 1
          fi

          # 7. Verify root-relative asset paths in dist/index.html
          if grep -q '/assets/' dist/index.html && grep -q 'favicon' dist/index.html; then
            echo "  ✅ [OK] dist/index.html uses root-relative '/assets/' and favicon links."
          else
            echo "  ❌ [ERROR] dist/index.html is missing root-relative '/assets/' paths!"
            exit 1
          fi

          echo "🎉 All Cloudflare Pages build verifications passed successfully!"

      - name: "Upload Cloudflare Pages Dist Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages-dist
          path: dist/
          retention-days: 30

      - name: "Wipe & Replace Target Repo (waltontventertainment/Toolzaro) with Built Files"
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          MY_SECRET_TOOLZARO: ${{ secrets.MY_SECRET_TOOLZARO }}
        run: |
          if [ -z "$MY_SECRET_TOOLZARO" ]; then
            echo "ℹ️ MY_SECRET_TOOLZARO secret is not set in Repository Secrets. Skipping external repo push."
            exit 0
          fi

          echo "🚀 Preparing clean deployment directory for waltontventertainment/Toolzaro.git..."
          DEPLOY_DIR=$(mktemp -d)

          # Copy all built files (including dotfiles like .well-known) from dist/ to DEPLOY_DIR
          cp -r dist/. "$DEPLOY_DIR/"

          # Exclude sensitive or worker-only scripts from static pages deployment
          rm -f "$DEPLOY_DIR/cloudflare-indexing-worker.js"

          # Add root-level wrangler.jsonc for Cloudflare Pages
          cat << 'EOF' > "$DEPLOY_DIR/wrangler.jsonc"
          {
            "name": "toolzaro",
            "compatibility_date": "2025-04-01",
            "assets": {
              "directory": "./",
              "not_found_handling": "single-page-application"
            }
          }
          EOF

          cd "$DEPLOY_DIR"
          git init
          git config user.name "Toolzaro CI/CD Bot"
          git config user.email "bot@toolzaro.cyou"
          git checkout -B main

          # Stage all new built files
          git add -A
          git commit -m "chore(deploy): production build synchronization (${GITHUB_SHA::7})"

          # Push to target deployment repository
          REMOTE_URL="https://x-access-token:${MY_SECRET_TOOLZARO}@github.com/waltontventertainment/Toolzaro.git"
          echo "Force-pushing fresh build to waltontventertainment/Toolzaro.git (main)..."
          git push --force "$REMOTE_URL" main:main || git push --force "https://${MY_SECRET_TOOLZARO}@github.com/waltontventertainment/Toolzaro.git" main:main
          echo "✅ Successfully synced fresh production build to waltontventertainment/Toolzaro.git!"

      - name: "Generate Workflow Summary"
        run: |
          TOTAL_ASSETS=$(find dist/assets -type f 2>/dev/null | wc -l)
          DIST_SIZE=$(du -sh dist | cut -f1)
          
          cat << EOF >> $GITHUB_STEP_SUMMARY
          ## ☁️ Cloudflare Pages Production Build & Verification

          | Metric | Status / Value |
          | :--- | :--- |
          | **Build Status** | ✅ Succeeded |
          | **Distribution Size** | \`${DIST_SIZE}\` |
          | **Bundled Asset Files** | \`${TOTAL_ASSETS}\` files |
          | **Admin Portal** | \`dist/sabbirhasan23m.html\` (Verified) |
          | **XML Sitemaps** | \`sitemap-index.xml\` + 5 sub-sitemaps (Verified) |
          | **Feed & Manifest** | \`rss.xml\`, \`feed.xml\`, \`site.webmanifest\` (Verified) |
          | **SPA Routing** | \`_redirects\` & \`_headers\` (Configured) |
          
          > 🚀 All domain assets, 3D favicons, sitemaps, and Cloudflare Pages SPA configurations verified.
          EOF
