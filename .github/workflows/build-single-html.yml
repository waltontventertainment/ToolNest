name: "Cloudflare Pages & Static Web Build & CI"

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  build-and-verify:
    name: "Build & Deploy Built Files to Toolzaro Repo"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Setup Node.js (Active LTS 22)"
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: "Install Dependencies"
        run: |
          if [ -f "package-lock.json" ]; then
            echo "package-lock.json found. Installing..."
            npm ci || npm install --legacy-peer-deps
          else
            echo "No lockfile found. Running npm install..."
            npm install --legacy-peer-deps
          fi

      - name: "Generate Dynamic Sitemaps, RSS Feed, Robots & Verify Domain Favicons"
        run: |
          npm run generate:seo

      - name: "Typecheck & Lint"
        run: |
          npm run lint

      - name: "Build Production Bundle for Cloudflare Pages"
        run: |
          npm run build
        env:
          NODE_ENV: production
          BUILD_SINGLEFILE: 'false'

      - name: "Verify Cloudflare Deployment Files, Favicons, Sitemaps & Asset Paths in dist/"
        run: |
          echo "Verifying presence of Cloudflare routing, favicons, sitemaps, static assets, and SEO files in dist/..."
          ls -la dist/

          # Ensure legacy _redirects is not present to avoid conflicting with Cloudflare wrangler.jsonc SPA routing
          if [ -f "dist/_redirects" ]; then
            echo "Removing legacy dist/_redirects to prevent conflict with Cloudflare SPA routing..."
            rm -f dist/_redirects
          fi

          # Check essential root HTML, Worker, Favicon, Manifest, Sitemap & AdSense files
          for file in \
            index.html \
            sabbir.html \
            pdf.worker.mjs \
            _headers \
            favicon.ico \
            favicon.svg \
            favicon.png \
            favicon-16x16.png \
            favicon-32x32.png \
            favicon-48x48.png \
            favicon-96x96.png \
            apple-touch-icon.png \
            android-chrome-192x192.png \
            android-chrome-512x512.png \
            logo.png \
            og-banner.jpg \
            site.webmanifest \
            manifest.json \
            browserconfig.xml \
            robots.txt \
            sitemap-index.xml \
            sitemap.xml \
            sitemap-tools.xml \
            sitemap-categories.xml \
            sitemap-pages.xml \
            sitemap-blog.xml \
            rss.xml \
            feed.xml \
            llms.txt \
            humans.txt \
            ads.txt \
            app-ads.txt \
            security.txt \
            googlea0fb90138c92702a.html; do
            if [ -f "dist/$file" ]; then
              echo "  [OK] dist/$file exists."
            else
              echo "  [ERROR] dist/$file is missing!"
              exit 1
            fi
          done

          # Check essential static directories (assets, cmaps, data)
          for dir in assets cmaps data; do
            if [ -d "dist/$dir" ]; then
              echo "  [OK] dist/$dir/ directory exists."
            else
              echo "  [ERROR] dist/$dir/ directory is missing!"
              exit 1
            fi
          done

          # Check countries dataset
          if [ -f "dist/data/countries.json" ]; then
            echo "  [OK] dist/data/countries.json exists."
          else
            echo "  [ERROR] dist/data/countries.json is missing!"
            exit 1
          fi

          # Verify that dist/index.html uses root-relative (/assets/) paths and includes /favicon.ico
          if grep -q '"/assets/' dist/index.html && grep -q '"/favicon.ico"' dist/index.html; then
            echo "  [OK] dist/index.html uses root-relative '/assets/' and '/favicon.ico' paths."
          else
            echo "  [ERROR] dist/index.html is missing root-relative '/assets/' or '/favicon.ico' paths!"
            exit 1
          fi

      - name: "Upload Cloudflare Pages Dist Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages-dist
          path: dist/
          retention-days: 30

      - name: "Wipe & Replace Target Repo (waltontventertainment/Toolzaro) with Built Files"
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          MY_SECRET_TOOLZARO: ${{ secrets.MY_SECRET_TOOLZARO }}
        run: |
          if [ -z "$MY_SECRET_TOOLZARO" ]; then
            echo "⚠️ MY_SECRET_TOOLZARO secret is not set in Repository Secrets. Skipping external repo push."
            exit 0
          fi

          echo "Preparing clean deployment directory for waltontventertainment/Toolzaro.git..."
          DEPLOY_DIR=$(mktemp -d)

          # Copy all built files (including dotfiles like .well-known) from dist/ to DEPLOY_DIR
          cp -r dist/. "$DEPLOY_DIR/"

          # Add root-level wrangler.jsonc for the pre-built Toolzaro repository
          cat << 'EOF' > "$DEPLOY_DIR/wrangler.jsonc"
          {
            "name": "toolzaro",
            "compatibility_date": "2025-04-01",
            "assets": {
              "directory": "./",
              "not_found_handling": "single-page-application"
            }
          }
          EOF

          cd "$DEPLOY_DIR"
          git init
          git config user.name "Toolzaro CI Bot"
          git config user.email "actions@github.com"
          git checkout -B main

          # Stage all new built files
          git add -A
          git commit -m "chore(deploy): clean replace with fresh production build (${GITHUB_SHA::7})"

          # Force push to waltontventertainment/Toolzaro.git (replaces all previous files cleanly)
          REMOTE_URL="https://x-access-token:${MY_SECRET_TOOLZARO}@github.com/waltontventertainment/Toolzaro.git"
          echo "Force-pushing fresh build to waltontventertainment/Toolzaro.git (main)..."
          git push --force "$REMOTE_URL" main:main
          echo "✅ Successfully wiped old files and uploaded fresh production build to waltontventertainment/Toolzaro.git!"

      - name: "Workflow Summary"
        run: |
          echo "## ☁️ Cloudflare Pages Build & Toolzaro Repo Sync Successful!" >> $GITHUB_STEP_SUMMARY
          echo "All domain favicons, dynamic XML sitemaps, AdSense files, and static assets have been verified in \`dist/\` and force-synced to \`waltontventertainment/Toolzaro\`." >> $GITHUB_STEP_SUMMARY
