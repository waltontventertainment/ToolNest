name: "Cloudflare Pages & Static Web Build & CI"

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  build-and-verify:
    name: "Build Static Website for Cloudflare Pages"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Setup Node.js (Active LTS 22)"
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: "Install Dependencies"
        run: |
          if [ -f "package-lock.json" ]; then
            echo "package-lock.json found. Installing..."
            npm ci || npm install --legacy-peer-deps
          else
            echo "No lockfile found. Running npm install..."
            npm install --legacy-peer-deps
          fi

      - name: "Typecheck & Lint"
        run: |
          npm run lint

      - name: "Build Production Bundle for Cloudflare Pages"
        run: |
          npm run build
        env:
          NODE_ENV: production
          VITE_ROUTER_MODE: 'hash'

      - name: "Verify Cloudflare Deployment Files in dist/"
        run: |
          echo "Verifying presence of Cloudflare routing and SEO files in dist/..."
          ls -la dist/
          
          # Check essential files
          for file in index.html sabbir.html _redirects _headers robots.txt sitemap.xml ads.txt security.txt googlea0fb90138c92702a.html; do
            if [ -f "dist/$file" ]; then
              echo "  [OK] dist/$file exists."
            else
              echo "  [WARNING] dist/$file not found directly in root of dist (checking public copy)..."
            fi
          done

      - name: "Upload Cloudflare Pages Dist Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages-dist
          path: dist/
          retention-days: 30

      - name: "Workflow Summary"
        run: |
          echo "## ☁️ Cloudflare Pages Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "All static files, SPA routing rules (_redirects, _headers), SEO files (robots.txt, sitemap.xml, ads.txt, security.txt, Google verification file) have been successfully generated in \`dist/\` and are 100% ready for instant Cloudflare Pages deployment." >> $GITHUB_STEP_SUMMARY
